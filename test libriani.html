const allQuestions = questionsData.concat(extraQuestionsData);
const container = document.getElementById('quiz-container');
const status = document.getElementById('status');
let done = 0;
let currentCategory = "";

allQuestions.forEach((item, index) => {
    if (item.cat !== currentCategory) {
        currentCategory = item.cat;
        const h = document.createElement('div');
        h.className = 'section-header';
        h.innerText = currentCategory;
        container.appendChild(h);
    }
    const card = document.createElement('div');
    card.className = 'question-card';
    const txt = document.createElement('div');
    txt.className = 'question-text';
    txt.innerText = `${index + 1}. ${item.q}`;
    card.appendChild(txt);
    
    const optsDiv = document.createElement('div');
    optsDiv.className = 'options';
    
    // Creiamo una copia delle opzioni e le mescoliamo
    const shuffledOptions = shuffle([...item.a]);
    
    shuffledOptions.forEach((atext) => {
        const btn = document.createElement('button');
        btn.innerText = atext;
        btn.onclick = () => {
            const btns = optsDiv.querySelectorAll('button');
            btns.forEach(b => b.disabled = true);
            if (atext === item.c) {
                btn.classList.add('correct');
            } else {
                btn.classList.add('wrong');
                // Trova e colora quella giusta
                btns.forEach(b => { if(b.innerText === item.c) b.classList.add('correct'); });
            }
            done++;
            status.innerText = `Domande completate: ${done} / ${allQuestions.length}`;
        };
        optsDiv.appendChild(btn);
    });
    card.appendChild(optsDiv);
    container.appendChild(card);
});
</script>
